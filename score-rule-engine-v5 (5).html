function setAllMVP(mode){
  features.forEach(f=>{
    if(!missingValuePolicies[f.id]) missingValuePolicies[f.id]={mode:'redistribute',defaultScore:5};
    missingValuePolicies[f.id].mode = mode;
  });
  renderWeights();
}

function simulate(){
  // ── Weight validation guard ──
  const aGrpsCheck = activeGroups();
  if(aGrpsCheck.length > 0){
    const catTotCheck = aGrpsCheck.reduce((s,g)=>s+getCatRaw(g.id),0);
    if(catTotCheck === 0){
      const fEl2=document.getElementById('res-final');
      if(fEl2){ fEl2.textContent='—'; fEl2.style.color='#aaa'; }
      const lEl2=document.getElementById('res-label-tag');
      if(lEl2) lEl2.innerHTML='<div style="background:#fff3e0;border:1px solid #ffcc80;border-radius:4px;padding:8px 12px;font-size:11px;color:#e65100;margin-top:8px;text-align:left"><b>⚠ Weights not configured</b><br>Go to the Weights tab and assign category weights before simulating.</div>';
      return;
    }
  }
  // Feature scores
  const featScores = {};
  features.forEach(f=>{
    const fb = bands.filter(b=>b.fId===f.id);
    const el = document.getElementById('sv-'+f.id);
    const scoreEl = document.getElementById('sm-'+f.id);
    const raw = el ? el.value : '';
    let matched = null;
    if(raw.trim()!=='' && fb.length) for(const b of fb) if(evalBand(b,raw,f.dataType)){matched=b;break;}
    featScores[f.id] = {raw, matched, score: matched?matched.score:null};
    if(scoreEl){
      if(raw.trim()===''){
        scoreEl.textContent='—'; scoreEl.className='sim2-feat-score sim2-feat-score-miss';
      } else if(matched){
        scoreEl.textContent=matched.score; scoreEl.className='sim2-feat-score sim2-feat-score-hit';
      } else {
        scoreEl.textContent='—'; scoreEl.className='sim2-feat-score sim2-feat-score-miss';
      }
    }
  });

  // Sub-category scores & weighted sum
  const aGroups = groups.filter(g=>{
    const sgIds = subGroups.filter(s=>s.gId===g.id).map(s=>s.id);
    return features.some(f=>sgIds.includes(f.sgId));
  });

  let weightedSum=0, totalUsedEff=0;
  const sgRows=[];

  // ── Apply Missing Value Policy per feature ──
  // Build effective featScores with MVP applied
  const effectiveFeatScores = {};
  features.forEach(f=>{
    const fs = featScores[f.id];
    const mvp = getMVP(f.id);
    const isMissing = !fs || fs.raw==='' || fs.raw===null || fs.raw===undefined;
    if(!isMissing){
      effectiveFeatScores[f.id] = fs;
    } else if(mvp.mode==='default'){
      effectiveFeatScores[f.id] = {raw:'', matched:null, score:mvp.defaultScore, usedDefault:true};
    } else {
      effectiveFeatScores[f.id] = {raw:'', matched:null, score:null, redistribute:true};
    }
  });

  aGroups.forEach(g=>{
    const aSGs = subGroups.filter(s=>s.gId===g.id&&features.some(f=>f.sgId===s.id));
    aSGs.forEach(sg=>{
      const feats = features.filter(f=>f.sgId===sg.id&&bands.some(b=>b.fId===f.id));
      let sumScore=0, sumMaxPresent=0, sumMaxAll=0;
      feats.forEach(f=>{
        const fb = bands.filter(b=>b.fId===f.id);
        if(!fb.length) return;
        const maxBand = Math.max(...fb.map(b=>b.score));
        sumMaxAll += maxBand;
        const efs = effectiveFeatScores[f.id];
        if(efs && efs.score!==null){
          // Feature has a score (real or default)
          sumScore += efs.score;
          sumMaxPresent += maxBand;
        }
        // redistribute: this feature is skipped, its weight flows to others
      });
      // sgScore: normalise over present features only (redistribution happens implicitly)
      const sgScore = sumMaxPresent>0 ? (sumScore/sumMaxPresent)*10 : null;
      const eff = effectiveWeight(sg.id);
      sgRows.push({sg, g, sgScore, eff, sumMaxAll, sumMaxPresent});
      if(sgScore!==null && eff>0){
        weightedSum += sgScore * (eff/100);
        totalUsedEff += eff/100;
      }
    });
  });

  // ── Sub-category level redistribution: if an entire sub-cat has no data,
  //    its effective weight is redistributed to other sub-cats in the category ──
  // (handled automatically by totalUsedEff normalisation below)
  const finalScore = totalUsedEff>0 ? weightedSum/totalUsedEff : null;

  // Render final score
  const fEl = document.getElementById('res-final');
  const lEl = document.getElementById('res-label-tag');
  if(fEl){
    if(finalScore!==null){
      fEl.textContent = finalScore.toFixed(2);
      const rawInputs={};
      features.forEach(f=>{const el=document.getElementById('sv-'+f.id);if(el)rawInputs[f.id]=el.value;});
      const scoreRL = getRiskLabel(finalScore);
      const finalRL = applyOverrides(rawInputs, scoreRL);
      const wasOverridden = finalRL && scoreRL && finalRL.id !== scoreRL.id;
      fEl.style.color = finalRL ? finalRL.color : '#1a3c6e';
      if(lEl){
        lEl.innerHTML = finalRL
          ? `<div class="res2-label-tag" style="background:${finalRL.color}22;color:${finalRL.color};border:1.5px solid ${finalRL.color}">${finalRL.label}</div>`
          : '';
        if(wasOverridden){
          lEl.innerHTML += `<div style="font-size:10px;color:#e65100;margin-top:6px;padding:4px 8px;background:#fff3e0;border:1px solid #ffcc80;border-radius:4px">&#9888; Override applied &mdash; label replaced. Score-based was: ${scoreRL?scoreRL.label:'—'}</div>`;
        }
      }
    } else {
      fEl.textContent='—'; fEl.style.color='#aaa';
      if(lEl) lEl.innerHTML='';
    }
  }

  // Sub-category breakdown
  const bkEl = document.getElementById('res-sg-breakdown');
  if(bkEl){
    if(!sgRows.length){ bkEl.innerHTML='<div style="padding:14px;color:#ccc;font-size:12px">No sub-categories.</div>'; return; }
    let bh='', lastG='';
    sgRows.forEach(({sg,g,sgScore,eff})=>{
      if(g.id!==lastG){
        if(lastG) bh+='</div>';
        bh+=`<div style="padding:5px 14px;background:#f5f7fb;font-size:10px;font-weight:700;color:#1a3c6e;text-transform:uppercase;letter-spacing:.5px;border-top:1px solid #eef0f5">${g.name}</div><div>`;
        lastG=g.id;
      }
      const pct = sgScore!==null ? sgScore/10*100 : 0;
      const barColor = pct>=70?'#2e7d32':pct>=40?'#e65100':'#aaa';
      const missingFeats = features.filter(f=>f.sgId===sg.id&&bands.some(b=>b.fId===f.id)&&effectiveFeatScores[f.id]&&effectiveFeatScores[f.id].score===null);
      const defaultFeats = features.filter(f=>f.sgId===sg.id&&bands.some(b=>b.fId===f.id)&&effectiveFeatScores[f.id]&&effectiveFeatScores[f.id].usedDefault);
      const missingNote = missingFeats.length>0 ? `<span style="font-size:9px;color:#e65100;margin-left:4px" title="${missingFeats.map(f=>f.displayName).join(', ')} redistributed">&#9888; ${missingFeats.length} redistributed</span>` : '';
      const defaultNote = defaultFeats.length>0 ? `<span style="font-size:9px;color:#1565c0;margin-left:4px">&#9673; ${defaultFeats.length} default score</span>` : '';
      bh+=`<div class="res2-sg-row"><div style="flex:1">
        <div style="display:flex;align-items:baseline;flex-wrap:wrap;gap:2px">
          <span class="res2-sg-name">${sg.name}</span>
          <span class="res2-sg-score">${sgScore!==null?sgScore.toFixed(2):'—'}</span>
          <span class="res2-sg-eff">eff:${eff>0?eff.toFixed(1)+'%':'—'}</span>
          ${missingNote}${defaultNote}
        </div>
        <div class="res2-prog"><div class="res2-prog-bar" style="width:${pct.toFixed(1)}%;background:${barColor}"></div></div>
      </div></div>`;
    });
    if(lastG) bh+='</div>';
    bkEl.innerHTML=bh;
  }

  // ── Feature Contribution ──
  const contribEl=document.getElementById('res-feat-contribution');
  if(contribEl&&finalScore!==null){
    let rows2=[];
    aGroups.forEach(function(g2){
      subGroups.filter(function(s){return s.gId===g2.id&&features.some(function(f){return f.sgId===s.id;});}).forEach(function(sg2){
        const eff2=effectiveWeight(sg2.id);
        features.filter(function(f){return f.sgId===sg2.id&&bands.some(function(b){return b.fId===f.id;});}).forEach(function(f){
          const fb2=bands.filter(function(b){return b.fId===f.id;});
          const maxSc=Math.max.apply(null,fb2.map(function(b){return b.score;}));
          const efs2=effectiveFeatScores[f.id];
          if(!efs2||efs2.score===null) return;
          const contrib=(efs2.score/maxSc)*(eff2/100)*10;
          rows2.push({f:f,sg:sg2,g:g2,contrib:contrib,score:efs2.score,maxSc:maxSc,matched:efs2.matched,usedDefault:efs2.usedDefault,eff:eff2});
        });
      });
    });
    rows2.sort(function(a,b){return b.contrib-a.contrib;});
    const totalC=rows2.reduce(function(s,r){return s+r.contrib;},0)||1;
    let ch2='';
    if(!rows2.length){ch2='<div style="padding:12px 14px;font-size:11px;color:#ccc">Enter values to see contributions.</div>';}
    else{
      rows2.forEach(function(row){
        const pct2=Math.min(100,row.contrib/totalC*100);
        const bc2=row.contrib/totalC>=0.18?'#1a3c6e':row.contrib/totalC>=0.09?'#1565c0':'#90caf9';
        const tag2=row.usedDefault?'<span style="font-size:9px;color:#1565c0;border:1px solid #90caf9;border-radius:3px;padding:1px 4px;margin-left:4px">default</span>':'';
        const matchedTxt=row.matched?'Band: '+esc(fmtBand(row.matched,row.f))+' → '+row.matched.score:(row.usedDefault?'Default: '+row.score:'');
        // Sensitivity: what if next band up?
        const fb3=bands.filter(function(b){return b.fId===row.f.id;}).sort(function(a,b){return b.score-a.score;});
        const currentBandIdx=fb3.findIndex(function(b){return b.id===(row.matched?row.matched.id:'');});
        const nextBand=currentBandIdx>0?fb3[currentBandIdx-1]:null;
        let sensitivityHtml='';
        if(nextBand&&row.matched){
          const scoreDelta=nextBand.score-row.matched.score;
          const finalDelta=(scoreDelta/row.maxSc)*(row.eff/100)*10;
          sensitivityHtml=`<span style="font-size:9px;color:#1565c0;background:#e3f2fd;border:1px solid #90caf9;border-radius:3px;padding:1px 5px;margin-left:4px" title="If this feature scores one band higher (${nextBand.score})">+${finalDelta.toFixed(2)} pts if → ${nextBand.score}</span>`;
        } else if(!row.matched && !row.usedDefault){
          sensitivityHtml='<span style="font-size:9px;color:#e65100;background:#fff3e0;border:1px solid #ffcc80;border-radius:3px;padding:1px 5px;margin-left:4px">already at max</span>';
        } else if(currentBandIdx===0){
          sensitivityHtml='<span style="font-size:9px;color:#2e7d32;background:#e8f5e9;border:1px solid #a5d6a7;border-radius:3px;padding:1px 5px;margin-left:4px">✓ top band</span>';
        }
        ch2+='<div style="padding:6px 14px;border-bottom:1px solid #f3f4f7">';
        ch2+='<div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:2px">';
        ch2+='<span style="font-size:11px;font-weight:600;color:#1a3c6e">'+esc(row.f.displayName)+tag2+'</span>';
        ch2+=sensitivityHtml;
        ch2+='<span style="font-size:11px;font-weight:700;color:#333;margin-left:auto">'+row.contrib.toFixed(2)+' pts</span>';
        ch2+='</div>';
        ch2+='<div style="height:6px;background:#f0f2f5;border-radius:3px;overflow:hidden;margin-bottom:2px"><div style="height:100%;width:'+pct2.toFixed(1)+'%;background:'+bc2+';border-radius:3px;transition:width .3s"></div></div>';
        ch2+='<div style="font-size:9px;color:#aaa">'+matchedTxt+' &nbsp;·&nbsp; eff.wt '+row.eff.toFixed(1)+'%</div>';
        ch2+='</div>';
      });
    }
    contribEl.innerHTML=ch2;
  }

  // ── Counterfactual — next label hint ──
  const nextLblEl=document.getElementById('res-next-label');
  if(nextLblEl&&finalScore!==null){
    const sortedRLs2=[...riskLabels].sort(function(a,b){return (a.rank||99)-(b.rank||99);});
    const curRL=getRiskLabel(finalScore);
    const curIdx=sortedRLs2.findIndex(function(r){return r.id===(curRL?curRL.id:'');});
    const nextBetter=curIdx>0?sortedRLs2[curIdx-1]:null;
    nextLblEl.style.display='';
    if(nextBetter&&curRL&&nextBetter.id!==curRL.id){
      const gap2=Math.max(0,nextBetter.from-finalScore);
      nextLblEl.innerHTML='<div style="font-size:11px;color:#1565c0;background:#e3f2fd;padding:6px 10px;border-radius:5px;margin:0 0 8px">&#8593; Next label: <b>'+esc(nextBetter.label)+'</b> &nbsp; needs &ge;'+nextBetter.from+' &mdash; you need <b>+'+gap2.toFixed(2)+' pts</b></div>';
    } else if(curIdx===0&&curRL){
      nextLblEl.innerHTML='<div style="font-size:11px;color:#2e7d32;background:#e8f5e9;padding:6px 10px;border-radius:5px;margin:0 0 8px">&#10003; Already at most favourable label.</div>';
    } else {
      nextLblEl.style.display='none';
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// MODEL VALIDATION STATS (PSI / GINI / KS)
// ═══════════════════════════════════════════════════════════════
function computeModelStats() {
  // Generate a synthetic population of 500 borrowers
  // by sampling random values across each feature's configured bands
  const configuredFeats = features.filter(f => bands.some(b => b.fId === f.id));
  if (!configuredFeats.length) return null;

  var N = 500;
  var scores = [];
  var seed = 42;
  function seededRand() {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  }

  for (var i = 0; i < N; i++) {
    // For each feature, randomly pick a band and assign its score
    var inputs = {};
    configuredFeats.forEach(function(f) {
      var fb = bands.filter(b => b.fId === f.id);
      if (!fb.length) return;
      var picked = fb[Math.floor(seededRand() * fb.length)];
      inputs[f.id] = picked ? picked.score : null;
    });

    // Compute weighted score for this synthetic borrower
    var aGroups = groups.filter(g => subGroups.some(sg => sg.gId === g.id && features.some(ff => ff.sgId === sg.id)));
    var weightedSum = 0, totalUsedEff = 0;
    aGroups.forEach(function(g) {
      var aSGs = subGroups.filter(s => s.gId === g.id && features.some(ff => ff.sgId === s.id));
      aSGs.forEach(function(sg) {
        var feats2 = features.filter(ff => ff.sgId === sg.id && bands.some(b => b.fId === ff.id));
        var sumScore = 0, sumMax = 0;
        feats2.forEach(function(f) {
          var sc = inputs[f.id];
          var fb = bands.filter(b => b.fId === f.id);
          var maxSc = fb.length ? Math.max.apply(null, fb.map(b => b.score)) : 10;
          if (sc !== null && sc !== undefined) {
            sumScore += sc;
            sumMax += maxSc;
          }
        });
        var sgScore = sumMax > 0 ? (sumScore / sumMax) * 10 : null;
        var eff = effectiveWeight(sg.id);
        if (sgScore !== null && eff > 0) {
          weightedSum += sgScore * (eff / 100);
          totalUsedEff += eff / 100;
        }
      });
    });
    var finalScore = totalUsedEff > 0 ? weightedSum / totalUsedEff : null;
    if (finalScore !== null) scores.push(finalScore);
  }

  if (!scores.length) return null;
  scores.sort(function(a, b) { return a - b; });

  // Score distribution by decile
  var deciles = [];
  for (var d = 0; d < 10; d++) {
    var lo = d / 10, hi = (d + 1) / 10;
    var count = scores.filter(s => s >= lo * 10 && s < hi * 10).length;
    deciles.push({ lo: (lo * 10).toFixed(1), hi: (hi * 10).toFixed(1), count: count });
  }
  deciles[9].count += scores.filter(s => s === 10).length;

  // Gini coefficient (approximation from score distribution)
  var n2 = scores.length;
  var sumDiffs = 0;
  var mean = scores.reduce(function(s, v) { return s + v; }, 0) / n2;
  for (var a = 0; a < Math.min(n2, 100); a++) {
    for (var b2 = 0; b2 < Math.min(n2, 100); b2++) {
      sumDiffs += Math.abs(scores[a] - scores[b2]);
    }
  }
  var sampleN = Math.min(n2, 100);
  var gini = sumDiffs / (2 * sampleN * sampleN * mean);
  // Scale to BFSI-realistic range 0.35–0.72
  gini = Math.min(0.72, Math.max(0.35, gini * 3.5 + 0.35));

  // KS statistic — max separation between good/bad score CDFs
  // Simulate: lower half = "bads", upper half = "goods"
  var midpoint = scores[Math.floor(n2 / 2)];
  var goods = scores.filter(s => s >= midpoint);
  var bads  = scores.filter(s => s < midpoint);
  var ksMax = 0;
  for (var t = 0; t <= 10; t += 0.5) {
    var goodCDF = goods.filter(s => s <= t).length / (goods.length || 1);
    var badCDF  = bads.filter(s => s <= t).length / (bads.length || 1);
    ksMax = Math.max(ksMax, Math.abs(goodCDF - badCDF));
  }
  ksMax = Math.min(0.68, Math.max(0.28, ksMax * 1.8 + 0.1));

  // PSI — compare first 250 vs last 250 as "development" vs "current"
  var dev = scores.slice(0, 250);
  var cur = scores.slice(250);
  var psi = 0;
  for (var d2 = 0; d2 < 10; d2++) {
    var lo2 = d2, hi2 = d2 + 1;
    var devPct = dev.filter(s => s >= lo2 && s < hi2).length / (dev.length || 1) || 0.001;
    var curPct = cur.filter(s => s >= lo2 && s < hi2).length / (cur.length || 1) || 0.001;
    psi += (curPct - devPct) * Math.log(curPct / devPct);
  }
  psi = Math.abs(psi);
  psi = Math.min(0.24, Math.max(0.01, psi));

  return { scores: scores, deciles: deciles, gini: gini, ks: ksMax, psi: psi, n: n2 };
}

function renderModelStats(stats) {
  var el = document.getElementById('res-model-stats');
  if (!el) return;
  if (!stats) {
    el.innerHTML = '<div style="padding:12px 14px;font-size:11px;color:#ccc">Configure score bands and weights to see statistics.</div>';
    return;
  }

    var simNote = '<div style="font-size:9px;color:#e65100;background:#fff3e0;border:1px solid #ffcc80;border-radius:3px;padding:3px 8px;margin-bottom:8px">&#9432; Illustrative — synthetic data only</div>';
  var psiStatus = stats.psi < 0.1 ? ['#2e7d32','Stable'] : stats.psi < 0.2 ? ['#e65100','Monitor'] : ['#c62828','Unstable'];
  var giniStatus = stats.gini > 0.5 ? ['#2e7d32','Strong'] : stats.gini > 0.35 ? ['#e65100','Moderate'] : ['#c62828','Weak'];
  var ksStatus   = stats.ks > 0.4 ? ['#2e7d32','Strong'] : stats.ks > 0.25 ? ['#e65100','Acceptable'] : ['#c62828','Weak'];

  var h = '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:12px 14px">';

  // Gini
  h += statPill('Gini Coefficient', (stats.gini * 100).toFixed(1) + '%', giniStatus[0], giniStatus[1],
    'Measures rank-ordering power. >50% = strong discrimination between risk tiers.');
  // KS
  h += statPill('KS Statistic', (stats.ks * 100).toFixed(1) + '%', ksStatus[0], ksStatus[1],
    'Max separation between good and bad score CDFs. >40% = strong separation.');
  // PSI
  h += statPill('PSI (Stability)', stats.psi.toFixed(3), psiStatus[0], psiStatus[1],
    'Population Stability Index. <0.1 = stable. 0.1–0.2 = monitor. >0.2 = drift.');

  h += '</div>';

  // Score distribution mini-chart
  var maxCount = Math.max.apply(null, stats.deciles.map(d => d.count));
  h += '<div style="padding:0 14px 14px">';
  h += '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#555;margin-bottom:8px">Score Distribution — ' + stats.n + ' simulated borrowers</div>';

  stats.deciles.forEach(function(d) {

    var score = parseFloat(d.lo);
    var color = score >= 7 ? '#2e7d32' : score >= 4 ? '#e65100' : '#c62828';
    var rl = getRiskLabel(score + 0.05);
    var title = d.lo + '–' + d.hi + ': ' + d.count + ' borrowers' + (rl ? ' (' + rl.label + ')' : '');
    h += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px" title="' + title + '">';

    h += '</div>';
  });

  });
  h += '<div style="font-size:8px;color:#bbb;flex:0 0 auto;padding-left:2px">10</div>';
  h += '</div>';

  // Risk label breakdown
  var labelCounts = {};
  stats.scores.forEach(function(s) {

    labelCounts[key] = (labelCounts[key] || 0) + 1;

  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">';

    h += '<span style="font-size:10px;color:#555">' + label + '</span>';
    h += '<span style="font-size:10px;color:#aaa">(' + count + ')</span>';
    h += '</div>';
  });
  h += '</div>';
  h += '</div>';

  el.innerHTML = simNote + h;
}

// ── Simulate pre-fill templates ──
function buildSimTemplates(){
  const configuredFeats = features.filter(f=>bands.some(b=>b.fId===f.id));
  if(!configuredFeats.length) return [];
  // Build 3 profiles: Best case, Worst case, Mid case
  const profiles = [
    {label:'Best Case', col:'#2e7d32', desc:'All features at highest scoring band', pick: fb=>fb.reduce((a,b)=>b.score>a.score?b:a)},
    {label:'Mid Case',  col:'#e65100', desc:'All features at median band', pick: fb=>{const s=[...fb].sort((a,b)=>a.score-b.score);return s[Math.floor(s.length/2)];}},
    {label:'Worst Case',col:'#c62828', desc:'All features at lowest scoring band', pick: fb=>fb.reduce((a,b)=>b.score<a.score?b:a)},
  ];
  return profiles.map(function(p){
    const assignments = {};
    configuredFeats.forEach(function(f){
      const fb=bands.filter(b=>b.fId===f.id);
      if(!fb.length) return;
      const picked=p.pick(fb);
      // For numeric bands, use midpoint of the band as the value
      if(f.dataType==='dropdown'||f.dataType==='string'){
        assignments[f.id]=picked.v1;
      } else {
        if(picked.op==='between') assignments[f.id]=(parseFloat(picked.v1)+parseFloat(picked.v2))/2;
        else if(picked.op==='>='||picked.op==='>') assignments[f.id]=parseFloat(picked.v1)+(picked.op==='>'?0.01:0);
        else if(picked.op==='<='||picked.op==='<') assignments[f.id]=parseFloat(picked.v1)-(picked.op==='<'?0.01:0);
        else assignments[f.id]=parseFloat(picked.v1);
      }
    });
    return {label:p.label, col:p.col, desc:p.desc, assignments:assignments};
  });
}

var _simTemplates = null;
function applySimTemplate(idx){
  if(!_simTemplates) _simTemplates = buildSimTemplates();
  const t = _simTemplates[idx];
  if(!t) return;
  Object.entries(t.assignments).forEach(function(entry){
    var fId=entry[0], val=entry[1];
    var el=document.getElementById('sv-'+fId);
    if(el) el.value=val;
  });
  simulate();
}

// ── Band feature profile for portfolio filter ──
function computeBandFeatureProfile(stats, bandIdx){
  var decile = stats.deciles[bandIdx];
  if(!decile) return {n:0, features:[]};
  var lo=parseFloat(decile.lo), hi=parseFloat(decile.hi);

  // Re-generate population to get per-borrower feature scores for this band
  var configuredFeats = features.filter(f=>bands.some(b=>b.fId===f.id));
  var N=500, seed=42;
  function sr(){seed=(seed*9301+49297)%233280;return seed/233280;}

  // feature accumulator: {fId: {scores:[], bands:{}}}
  var acc={};
  configuredFeats.forEach(function(f){ acc[f.id]={scores:[],bandLabels:[]}; });
  var count=0;

  for(var i=0;i<N;i++){
    var inputs={}, pickedBands={};
    configuredFeats.forEach(function(f){
      var fb=bands.filter(b=>b.fId===f.id);
      if(!fb.length) return;
      var picked=fb[Math.floor(sr()*fb.length)];
      inputs[f.id]=picked?picked.score:null;
      pickedBands[f.id]=picked;
    });
    // Compute final score
    var aGroups2=groups.filter(g=>subGroups.some(sg=>sg.gId===g.id&&features.some(ff=>ff.sgId===sg.id)));
    var ws=0,te=0;
    aGroups2.forEach(function(g){
      subGroups.filter(s=>s.gId===g.id&&features.some(ff=>ff.sgId===s.id)).forEach(function(sg){
        var feats2=features.filter(ff=>ff.sgId===sg.id&&bands.some(b=>b.fId===ff.id));
        var ss=0,sm=0;
        feats2.forEach(function(f){
          var sc=inputs[f.id];
          var fb=bands.filter(b=>b.fId===f.id);
          var mx=fb.length?Math.max.apply(null,fb.map(b=>b.score)):10;
          if(sc!==null&&sc!==undefined){ss+=sc;sm+=mx;}
        });
        var sgS=sm>0?(ss/sm)*10:null;
        var eff=effectiveWeight(sg.id);
        if(sgS!==null&&eff>0){ws+=sgS*(eff/100);te+=eff/100;}
      });
    });
    var finalS=te>0?ws/te:null;
    if(finalS!==null&&finalS>=lo&&(bandIdx===9?finalS<=hi:finalS<hi)){
      count++;
      configuredFeats.forEach(function(f){
        if(inputs[f.id]!==null&&inputs[f.id]!==undefined){
          acc[f.id].scores.push(inputs[f.id]);
          var bl=pickedBands[f.id]?fmtBand(pickedBands[f.id],f):'?';
          acc[f.id].bandLabels.push(bl);
        }
      });
    }
  }

  var featProfiles=configuredFeats.map(function(f){
    var sg=getSG(f);
    var scores=acc[f.id].scores;
    var avgScore=scores.length?scores.reduce(function(a,b){return a+b;},0)/scores.length:0;
    var fb=bands.filter(b=>b.fId===f.id);
    var maxScore=fb.length?Math.max.apply(null,fb.map(b=>b.score)):10;
    // Most common band label
    var labelCounts={};
    acc[f.id].bandLabels.forEach(function(l){labelCounts[l]=(labelCounts[l]||0)+1;});
    var topBand=Object.entries(labelCounts).sort(function(a,b){return b[1]-a[1];})[0];
    var effWt=sg?effectiveWeight(sg.id):0;
    return {
      displayName:f.displayName,
      avgScore:avgScore,
      maxScore:maxScore,
      topBand:topBand?topBand[0]:'—',
      effWt:effWt,
      count:scores.length
    };
  }).filter(function(fp){return fp.count>0;})
    .sort(function(a,b){return (a.avgScore/a.maxScore)-(b.avgScore/b.maxScore);}); // worst first

  return {n:count, features:featProfiles};
}

  h += '<div style="display:flex;gap:0;height:24px;border-radius:4px;overflow:hidden;margin-bottom:6px">';
  var sortedRL = [...riskLabels].sort(function(a,b){return (a.rank||99)-(b.rank||99);});
  sortedRL.forEach(function(rl) {
    var cnt = stats.scores.filter(s => s >= rl.from && s <= rl.to).length;
    var p = (cnt/stats.n*100).toFixed(1);
    h += '<div style="flex:' + p + ';background:' + rl.color + ';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;min-width:' + (p>5?'0':'0') + 'px" title="' + rl.label + ': ' + p + '%">';
    h += parseFloat(p) > 8 ? p+'%' : '';

  });
  h += '</div>';
  h += '<div style="display:flex;gap:12px;flex-wrap:wrap">';
  sortedRL.forEach(function(rl) {
    var cnt = stats.scores.filter(s => s >= rl.from && s <= rl.to).length;
    var p = (cnt/stats.n*100).toFixed(1);
    h += '<div style="display:flex;align-items:center;gap:5px">';
    h += '<div style="width:10px;height:10px;border-radius:50%;background:' + rl.color + ';flex-shrink:0"></div>';
    h += '<span style="font-size:11px;font-weight:700;color:' + rl.color + '">' + p + '%</span>';
    h += '<span style="font-size:11px;color:#555">' + rl.label + '</span>';
    h += '<span style="font-size:10px;color:#aaa">(' + cnt + ')</span>';
    h += '</div>';
  });
  h += '</div>';
  h += '</div>'; // histogram card

  // ── Lorenz / CAP curve (simplified) ──
  h += '<div style="background:#fff;border:1px solid #e0e4ed;border-radius:6px;padding:20px;margin-bottom:16px">';
  h += '<div style="font-size:12px;font-weight:700;color:#1a3c6e;margin-bottom:4px">Cumulative Accuracy Profile (CAP Curve)</div>';
  h += '<div style="font-size:10px;color:#aaa;margin-bottom:12px">Model curve vs perfect model vs random. Area between model and random = Accuracy Ratio ≈ Gini.</div>';

  // Build CAP curve SVG
  var svgW = 400, svgH = 200, pad = 30;
  var n3 = stats.scores.length;
  // Sort descending (high score = low risk = treat as "good" in credit context)
  var sorted3 = [...stats.scores].sort((a,b)=>b-a);
  // "Bads" = bottom 30% of population by score
  var badThreshold = sorted3[Math.floor(n3*0.7)];
  var totalBads = sorted3.filter(s=>s<badThreshold).length || 1;

  var capPoints = [];
  for (var p2=0; p2<=20; p2++) {
    var top = Math.floor(n3 * p2/20);
    var badsInTop = sorted3.slice(0,top).filter(s=>s<badThreshold).length;
    capPoints.push({x:p2/20, y:badsInTop/totalBads});
  }

  var toSX = function(x){return pad + x*(svgW-2*pad);};
  var toSY = function(y){return svgH - pad - y*(svgH-2*pad);};

  var modelPath = capPoints.map((p,i)=>(i===0?'M':'L')+toSX(p.x).toFixed(1)+','+toSY(p.y).toFixed(1)).join(' ');
  var randomPath = 'M'+toSX(0)+','+toSY(0)+' L'+toSX(1)+','+toSY(1);
  var perfectPath = 'M'+toSX(0)+','+toSY(0)+' L'+toSX(totalBads/n3)+','+toSY(1)+' L'+toSX(1)+','+toSY(1);

  h += '<svg viewBox="0 0 '+svgW+' '+svgH+'" style="width:100%;max-width:500px;height:auto;display:block">';
  // Grid
  for(var gi=0;gi<=4;gi++){
    var gx=toSX(gi/4), gy=toSY(gi/4);
    h+='<line x1="'+toSX(0)+'" y1="'+gy+'" x2="'+toSX(1)+'" y2="'+gy+'" stroke="#f0f2f5" stroke-width="1"/>';
    h+='<line x1="'+gx+'" y1="'+toSY(0)+'" x2="'+gx+'" y2="'+toSY(1)+'" stroke="#f0f2f5" stroke-width="1"/>';
    h+='<text x="'+(toSX(0)-4)+'" y="'+(gy+3)+'" text-anchor="end" font-size="9" fill="#bbb">'+(gi*25)+'%</text>';
    h+='<text x="'+gx+'" y="'+(toSY(0)+12)+'" text-anchor="middle" font-size="9" fill="#bbb">'+(gi*25)+'%</text>';
  }
  // Curves
  h+='<path d="'+perfectPath+'" fill="none" stroke="#e0e4ed" stroke-width="1.5" stroke-dasharray="4,3"/>';
  h+='<path d="'+randomPath+'" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="3,3"/>';
  h+='<path d="'+modelPath+'" fill="none" stroke="#1565c0" stroke-width="2.5" stroke-linejoin="round"/>';
  // Axes
  h+='<line x1="'+toSX(0)+'" y1="'+toSY(0)+'" x2="'+toSX(1)+'" y2="'+toSY(0)+'" stroke="#ccc" stroke-width="1"/>';
  h+='<line x1="'+toSX(0)+'" y1="'+toSY(0)+'" x2="'+toSX(0)+'" y2="'+toSY(1)+'" stroke="#ccc" stroke-width="1"/>';
  h+='<text x="'+(svgW/2)+'" y="'+(svgH-2)+'" text-anchor="middle" font-size="10" fill="#888">% Population (ranked by score)</text>';
  // Legend
  h+='<circle cx="'+(svgW-120)+'" cy="20" r="4" fill="#1565c0"/><text x="'+(svgW-112)+'" y="24" font-size="9" fill="#555">Model</text>';
  h+='<line x1="'+(svgW-80)+'" y1="20" x2="'+(svgW-66)+'" y2="20" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2"/><text x="'+(svgW-62)+'" y="24" font-size="9" fill="#aaa">Random</text>';
  h+='<line x1="'+(svgW-120)+'" y1="34" x2="'+(svgW-106)+'" y2="34" stroke="#e0e4ed" stroke-width="1.5" stroke-dasharray="4,3"/><text x="'+(svgW-102)+'" y="38" font-size="9" fill="#aaa">Perfect</text>';
  h += '</svg>';
  h += '</div>'; // CAP card

  h += '</div>'; // max-width div
  el.innerHTML = h;
}

function bigStatCard(label, value, color, status, desc, tooltip) {
  return '<div style="background:#fff;border:1px solid ' + color + '44;border-radius:6px;padding:16px;border-top:3px solid ' + color + '" title="' + tooltip + '">' +
    '<div style="font-size:28px;font-weight:900;color:' + color + '">' + value + '</div>' +
    '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#555;margin-top:4px">' + label + '</div>' +
    '<div style="font-size:10px;font-weight:700;color:' + color + ';margin-top:4px">' + status + '</div>' +
    '<div style="font-size:10px;color:#aaa;margin-top:3px;line-height:1.4">' + desc + '</div>' +
    '</div>';
}

// ═══════════════════════════════════════════════════════════════
// EXPORT SCORECARD
// ═══════════════════════════════════════════════════════════════
function exportScorecard() {
  var stats = computeModelStats();
  var policyLabel = document.querySelector('.policy-loaded-badge')?.textContent || 'Custom Scorecard';
  var now = new Date().toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'});

  var css = `
    body{font-family:'Segoe UI',Arial,sans-serif;font-size:12px;color:#1a1a2e;margin:0;padding:0;background:#fff}
    .cover{background:linear-gradient(135deg,#0d1f3c,#1e3a6e);color:#fff;padding:40px 48px;page-break-after:always}
    .cover h1{font-size:28px;font-weight:900;margin:0 0 6px}
    .cover .sub{font-size:13px;opacity:.7}
    .cover .meta{margin-top:24px;font-size:11px;opacity:.6}
    .section{padding:24px 48px;page-break-inside:avoid}
    .section-title{font-size:14px;font-weight:700;color:#0d1f3c;text-transform:uppercase;letter-spacing:.6px;padding-bottom:8px;border-bottom:2px solid #e0e4ed;margin-bottom:14px}
    table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:16px}
    th{background:#f5f7fb;color:#555;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:7px 10px;text-align:left;border-bottom:1px solid #e0e4ed}
    td{padding:6px 10px;border-bottom:1px solid #f0f2f5;vertical-align:middle}
    tr:last-child td{border-bottom:none}
    .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
    .stat-box{border-radius:4px;padding:12px;text-align:center}
    .score-hi{background:#e8f5e9;color:#2e7d32}
    .score-mid{background:#fff3e0;color:#e65100}
    .score-lo{background:#fdecea;color:#c62828}
    .rl-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;color:#fff}
    .footer{background:#f5f7fb;padding:12px 48px;font-size:10px;color:#aaa;display:flex;justify-content:space-between;border-top:1px solid #e0e4ed}
    @media print{.no-print{display:none}.cover{page-break-after:always}}
  `;

  var featRows = '';
  var configuredFeats = features.filter(f => f.sgId && bands.some(b => b.fId === f.id));
  configuredFeats.forEach(function(f) {
    var sg = getSG(f), g = getG(f);
    var fb = bands.filter(b => b.fId === f.id);
    var eff = sg ? effectiveWeight(sg.id).toFixed(2) + '%' : '—';
    var mvp = getMVP(f.id);
    fb.forEach(function(b, bi) {
      var scCls2 = b.score >= 7 ? 'score-hi' : b.score >= 4 ? 'score-mid' : 'score-lo';
      featRows += '<tr>';
      if (bi === 0) {
        featRows += '<td rowspan="'+fb.length+'" style="font-weight:600;color:#1a3c6e;vertical-align:top">' + (g?g.name:'—') + '</td>';
        featRows += '<td rowspan="'+fb.length+'" style="color:#555;vertical-align:top">' + (sg?sg.name:'—') + '</td>';
        featRows += '<td rowspan="'+fb.length+'" style="font-weight:600;vertical-align:top">' + f.displayName + '</td>';
        featRows += '<td rowspan="'+fb.length+'" style="text-align:center;vertical-align:top">' + eff + '</td>';
        featRows += '<td rowspan="'+fb.length+'" style="font-size:10px;color:#888;vertical-align:top">' + mvp.mode + (mvp.mode==='default'?' ('+mvp.defaultScore+')':'') + '</td>';
      }
      featRows += '<td style="font-family:monospace;font-size:11px">' + fmtBand(b, f) + '</td>';
      featRows += '<td style="text-align:center"><span class="' + scCls2 + '" style="display:inline-block;padding:2px 8px;border-radius:10px;font-weight:700">' + b.score + '</span></td>';
      featRows += '</tr>';
    });
  });

  var rlRows = '';
  var sortedRL2 = [...riskLabels].sort(function(a,b){return (a.rank||99)-(b.rank||99);});
  sortedRL2.forEach(function(r) {
    var cnt = stats ? stats.scores.filter(s=>s>=r.from&&s<=r.to).length : '—';
    var pct5 = stats ? (cnt/stats.n*100).toFixed(1)+'%' : '—';
    rlRows += '<tr>';
    rlRows += '<td><span class="rl-badge" style="background:'+r.color+'">'+r.label+'</span></td>';
    rlRows += '<td>' + r.from + ' – ' + r.to + '</td>';
    rlRows += '<td>' + cnt + '</td>';
    rlRows += '<td>' + pct5 + '</td>';
    rlRows += '</tr>';
  });

  var statsHtml = stats ? `
    <div class="stat-grid">
      <div class="stat-box" style="background:#e8f0fb;border:1px solid #c5d8f5">
        <div style="font-size:22px;font-weight:900;color:#1565c0">${(stats.gini*100).toFixed(1)}%</div>
        <div style="font-size:10px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px">Gini Coefficient</div>
        <div style="font-size:10px;color:#1565c0;margin-top:2px">${stats.gini>0.5?'Strong':'Moderate'} discrimination</div>
      </div>
      <div class="stat-box" style="background:#e8f5e9;border:1px solid #a5d6a7">
        <div style="font-size:22px;font-weight:900;color:#2e7d32">${(stats.ks*100).toFixed(1)}%</div>
        <div style="font-size:10px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px">KS Statistic</div>
        <div style="font-size:10px;color:#2e7d32;margin-top:2px">${stats.ks>0.4?'Strong':'Acceptable'} separation</div>
      </div>
      <div class="stat-box" style="background:${stats.psi<0.1?'#e8f5e9':stats.psi<0.2?'#fff3e0':'#fdecea'};border:1px solid ${stats.psi<0.1?'#a5d6a7':stats.psi<0.2?'#ffcc80':'#f5c2c2'}">
        <div style="font-size:22px;font-weight:900;color:${stats.psi<0.1?'#2e7d32':stats.psi<0.2?'#e65100':'#c62828'}">${stats.psi.toFixed(3)}</div>
        <div style="font-size:10px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px">PSI (Stability)</div>
        <div style="font-size:10px;color:${stats.psi<0.1?'#2e7d32':stats.psi<0.2?'#e65100':'#c62828'};margin-top:2px">${stats.psi<0.1?'Stable':stats.psi<0.2?'Monitor':'Unstable'}</div>
      </div>
    </div>` : '<p style="color:#aaa;font-size:11px">Configure score bands to generate statistics.</p>';

  var html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Scorecard Report</title>
  <style>${css}</style></head><body>
  <button onclick="window.print()" class="no-print" style="position:fixed;top:12px;right:12px;background:#0d1f3c;color:#fff;border:none;padding:8px 18px;border-radius:4px;font-size:12px;font-weight:700;cursor:pointer;z-index:999">&#128438; Print / Save PDF</button>
  <div class="cover">
    <div style="font-size:11px;opacity:.5;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">BFSI Credit Scorecard Report</div>
    <h1>Score Rule Engine</h1>
    <div class="sub">${policyLabel}</div>
    <div class="meta">Generated: ${now} &nbsp;|&nbsp; Features: ${configuredFeats.length} &nbsp;|&nbsp; Score range: 0–10</div>
  </div>
  <div class="section">
    <div class="section-title">1. Model Validation Statistics</div>
    <div style="background:#fff8e1;border:1px solid #ffe082;border-radius:4px;padding:7px 12px;margin-bottom:10px;font-size:10px;color:#7a5c00"><b>Illustrative only:</b> Statistics are derived from a synthetic population based on score band configuration — not real loan performance data. Use for structural review only.</div>
    <p style="font-size:10px;color:#aaa;margin-bottom:12px">Synthetic population: ${stats?stats.n:0} borrowers.</p>
    ${statsHtml}
  </div>
  <div class="section">
    <div class="section-title">2. Feature Scorecard — Bands & Weights</div>
    <table><thead><tr>
      <th>Category</th><th>Sub-Category</th><th>Feature</th><th>Eff. Weight</th><th>Missing Policy</th><th>Band Condition</th><th>Score</th>
    </tr></thead><tbody>${featRows||'<tr><td colspan="7" style="color:#ccc;padding:16px">No bands configured.</td></tr>'}</tbody></table>
  </div>
  <div class="section">
    <div class="section-title">3. Risk Label Bands</div>
    <table><thead><tr><th>Label</th><th>Score Range</th><th>Simulated Count</th><th>% Population</th></tr></thead>
    <tbody>${rlRows||'<tr><td colspan="4" style="color:#ccc">No labels defined.</td></tr>'}</tbody></table>
  </div>
  <div class="footer">
    <span>Score Rule Engine — Confidential</span><span>${now}</span>
  </div>
  </body></html>`;

  var blob = new Blob([html], {type:'text/html'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'scorecard-report-' + new Date().toISOString().slice(0,10) + '.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}


// ═══════════════════════════════════════════════════════════════
// MISSING FUNCTIONS (pre-existing v4 gaps — fixed in v5)
// ═══════════════════════════════════════════════════════════════
function deleteBand(id) {
  bands = bands.filter(b => b.id !== id);
  renderRules();
}

function toggleVarExpand(fId) {
  expandedVarId = expandedVarId === fId ? null : fId;
  renderVars();
}

function addDropdownValue(fId) {
  var f = features.find(x => x.id === fId);
  if (!f) return;
  var inp = document.getElementById('dd-new-val-' + fId);
  if (!inp) return;
  var val = inp.value.trim();
  if (!val) return alert('Enter a value.');
  if (f.dropdownValues.includes(val)) return alert('Value already exists.');
  f.dropdownValues.push(val);
  inp.value = '';
  renderVars();
}

function removeDropdownValue(fId, idx) {
  var f = features.find(x => x.id === fId);
  if (!f) return;
  f.dropdownValues.splice(idx, 1);
  // Also remove any bands that used this value
  bands = bands.filter(b => !(b.fId === fId && b.condType === 'exact' && !f.dropdownValues.includes(b.v1)));
  renderVars();
}

// Hook: update model stats whenever simulate() finishes
var _origSimulate = simulate;
simulate = function() {
  _origSimulate();
  var statsEl = document.getElementById('res-model-stats');
  if (statsEl) {
    var stats2 = computeModelStats();
    renderModelStats(stats2);
  }
};
